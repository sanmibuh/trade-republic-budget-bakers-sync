services:
  tr-sync-david:
    build: .
    container_name: tr-sync-david
    environment:
      OWNER_NAME: "david"
      PHONE_NUMBER: ""
      WALLET_API_KEY: ""
      WALLET_CASH_ACCOUNT_ID: ""
      WALLET_PORTFOLIO_ACCOUNT_ID: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      LOOKBACK_DAYS: "7"
    volumes:
      - ./data/david:/app/data
      - ./output/david:/app/output

  tr-sync-eli:
    build: .
    container_name: tr-sync-eli
    environment:
      OWNER_NAME: "eli"
      PHONE_NUMBER: ""
      WALLET_API_KEY: ""
      WALLET_CASH_ACCOUNT_ID: ""
      WALLET_PORTFOLIO_ACCOUNT_ID: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      LOOKBACK_DAYS: "7"
    volumes:
      - ./data/eli:/app/data
      - ./output/eli:/app/output
