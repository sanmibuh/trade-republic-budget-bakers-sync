name: tr-sync

services:
  tr-sync:
    image: ghcr.io/sanmibuh/tr-wallet-sync:v7.0.0
    restart: unless-stopped
    healthcheck:
      # Verifies that both the cron daemon and the Telegram bot process are alive.
      # Bracket notation avoids pgrep matching its own process.
      test: ["CMD-SHELL", "pgrep cron > /dev/null && pgrep -f '[a]pp bot' > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      # Path to the instances YAML config (mounted below)
      INSTANCES_CONFIG: /app/config/instances.yml
      # Cron schedule for all sync instances
      SYNC_SCHEDULE: "0 8,14,21 * * *"
      # Cron schedule for automatic backup
      BACKUP_SCHEDULE: "0 3 * * *"
      TZ: "Europe/Berlin"
      # ALLOW_INSECURE_SSL: "true"  # Uncomment only if SSL verification fails in your environment
    volumes:
      # Instances YAML — contains all credentials for sync, bot, and backup (keep secret, never commit)
      - ./instances.yml:/app/config/instances.yml:ro
      # Single data volume — per-instance subdirs and backup subdir are managed automatically
      - ./data:/app/data
