name: Bump major version after Dependabot merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  bump-version:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if requirements.txt was modified
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^requirements"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump major version
        if: steps.check.outputs.changed == 'true'
        id: bump
        run: |
          CURRENT=$(cat VERSION)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          NEW_VERSION="$((MAJOR + 1)).0.0"
          echo "$NEW_VERSION" > VERSION
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Open PR with version bump
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/bump-version-${{ steps.bump.outputs.new_version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION
          git commit -m "chore: bump major version to ${{ steps.bump.outputs.new_version }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: bump version ${{ steps.bump.outputs.current_version }} → ${{ steps.bump.outputs.new_version }}" \
            --body "Automated major version bump following Dependabot update to \`requirements.txt\`.

          Merging this PR will trigger a rebuild of both the base image (\`python-trade-republic\`) and the app image (\`tr-wallet-sync\`)." \
            --base main \
            --head "$BRANCH" \
            --label "dependencies"
