name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_RELEASE }}

      - name: Calculate next version
        id: version
        run: |
          CURRENT=$(cat VERSION)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Update VERSION
        run: echo "${{ steps.version.outputs.new }}" > VERSION

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.PAT_RELEASE }}
        run: |
          NEW="${{ steps.version.outputs.new }}"
          CURRENT="${{ steps.version.outputs.current }}"
          BUMP="${{ inputs.bump }}"
          BRANCH="release-${NEW}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION
          git commit -m "[release-${NEW}]: chore: update version to ${NEW}"
          git push origin "$BRANCH" --force-with-lease 2>/dev/null || git push origin "$BRANCH" --force

          if [ "$BUMP" = "major" ]; then
            DOCKER_NOTE="- Trigger the Docker build workflows for both \`python-trade-republic\` and \`tr-wallet-sync:v${NEW}\`"
          else
            DOCKER_NOTE="- Trigger the Docker image publish workflow for \`tr-wallet-sync:v${NEW}\`"
          fi

          gh pr create \
            --title "[release-${NEW}]: chore: update version to ${NEW}" \
            --body "## Release ${NEW} (${BUMP})

          Bumps version \`${CURRENT}\` → \`${NEW}\`.

          **Merging this PR will:**
          - Trigger \`release.yml\` → create tag \`v${NEW}\` + GitHub Release
          ${DOCKER_NOTE}" \
            --base main \
            --head "$BRANCH"
