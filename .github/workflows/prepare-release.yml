name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_RELEASE }}

      - name: Calculate next version
        id: version
        run: |
          CURRENT=$(cat VERSION)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Update VERSION
        run: echo "${{ steps.version.outputs.new }}" > VERSION

      - name: Update CHANGELOG
        run: |
          NEW="${{ steps.version.outputs.new }}"
          CURRENT="${{ steps.version.outputs.current }}"
          TODAY=$(date -u +%Y-%m-%d)

          # Collect commits between current tag and HEAD
          COMMITS=$(git log "v${CURRENT}..HEAD" --pretty=format:"- %s" 2>/dev/null || echo "<!-- add release notes here -->")
          if [ -z "$COMMITS" ]; then
            COMMITS="<!-- add release notes here -->"
          fi

          printf -v NEW_SECTION "## [%s] - %s\n\n%s\n\n" "$NEW" "$TODAY" "$COMMITS"

          # Prepend the new section after the header (after the second blank line following "The format is based on...")
          awk -v section="$NEW_SECTION" '
            /^The format is based on/ && !inserted {
              print
              print ""
              printf "%s", section
              inserted=1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.PAT_RELEASE }}
        run: |
          NEW="${{ steps.version.outputs.new }}"
          CURRENT="${{ steps.version.outputs.current }}"
          BUMP="${{ inputs.bump }}"
          BRANCH="release-${NEW}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION CHANGELOG.md
          git commit -m "[release-${NEW}]: chore: update version to ${NEW}"
          git push origin "$BRANCH" --force-with-lease 2>/dev/null || git push origin "$BRANCH" --force

          if [ "$BUMP" = "major" ]; then
            DOCKER_NOTE="- Trigger the Docker build workflows for both \`python-trade-republic\` and \`tr-wallet-sync:v${NEW}\`"
          else
            DOCKER_NOTE="- Trigger the Docker image publish workflow for \`tr-wallet-sync:v${NEW}\`"
          fi

          gh pr create \
            --title "[release-${NEW}]: chore: update version to ${NEW}" \
            --body "## Release ${NEW} (${BUMP})

          Bumps version \`${CURRENT}\` → \`${NEW}\`.

          **Before merging, please review the new \`CHANGELOG.md\` section** at the top of the file and fill in / refine the release notes.

          **Merging this PR will:**
          - Trigger \`release.yml\` → create tag \`v${NEW}\` + GitHub Release
          ${DOCKER_NOTE}" \
            --base main \
            --head "$BRANCH"
