name: Publish base image

on:
  push:
    tags:
      - 'v[0-9]*.0.0'   # major releases only: v1.0.0, v2.0.0, ...
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build (e.g. v3.0.0)"
        required: true

jobs:
  publish-base:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/python-trade-republic:latest
            ghcr.io/${{ github.repository_owner }}/python-trade-republic:${{ steps.meta.outputs.version }}

  update-base-tag:
    needs: publish-base
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version tag
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: invalid version format: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update ARG BASE_TAG in app Dockerfile
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          sed -i "s|^ARG BASE_TAG=.*|ARG BASE_TAG=${VERSION}|" docker/app/Dockerfile

      - name: Commit updated Dockerfile
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker/app/Dockerfile
          if ! git diff --cached --quiet; then
            git pull --rebase origin main
            git commit -m "chore: update BASE_TAG to ${VERSION} in app Dockerfile"
            git push
          fi

  publish-app:
    needs: update-base-tag
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          no-cache: true
          build-args: |
            BASE_TAG=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tr-wallet-sync:latest
            ghcr.io/${{ github.repository_owner }}/tr-wallet-sync:${{ steps.meta.outputs.version }}
