name: Publish app image

on:
  push:
    tags:
      - 'v[0-9]+.[1-9][0-9]*.0'   # minor releases: v1.1.0, v1.2.0, ... (not v1.0.0)
      - 'v[0-9]+.[0-9]+.[1-9][0-9]*'  # patch releases: v1.1.1, v1.2.3, ...

jobs:
  publish-app:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tr-wallet-sync:latest
            ghcr.io/${{ github.repository_owner }}/tr-wallet-sync:${{ steps.meta.outputs.version }}
