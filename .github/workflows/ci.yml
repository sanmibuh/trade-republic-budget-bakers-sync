name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        id: tests
        run: |
          python -m pytest --cov=app --cov-fail-under=97 \
            --cov-report=term-missing \
            --cov-report=json 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # On merge to main: save coverage.json to ci-data branch
      # ----------------------------------------------------------------
      - name: Save coverage to ci-data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-data
          git checkout ci-data
          cp ${{ github.workspace }}/coverage.json ./coverage.json
          git add coverage.json
          git diff --cached --quiet || git commit -m "chore: update coverage from main@${{ github.sha }}"
          git push origin ci-data
          git checkout main

      # ----------------------------------------------------------------
      # On PR: compare with main coverage and post comment
      # ----------------------------------------------------------------
      - name: Fetch main coverage from ci-data
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ci-data
          git show origin/ci-data:coverage.json > main-coverage.json 2>/dev/null || echo '{}' > main-coverage.json

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(python -c "import json; d=json.load(open('coverage.json')); print(d['totals']['percent_covered_display'])")
          MAIN_TOTAL=$(python -c "
          import json, sys
          try:
              d = json.load(open('main-coverage.json'))
              print(d['totals']['percent_covered_display'])
          except Exception:
              print('N/A')
          ")

          PASSED=$(grep -oP '\d+ passed' test-output.txt || echo "0 passed")
          FAILED=$(grep -oP '\d+ failed' test-output.txt || echo "")
          EXIT_CODE="${{ steps.tests.outputs.exit_code }}"

          if [ "$EXIT_CODE" = "0" ]; then
            STATUS="✅ All checks passed"
          else
            STATUS="❌ Checks failed"
          fi

          # Coverage diff
          if [ "$MAIN_TOTAL" = "N/A" ]; then
            COVERAGE_DIFF="(no baseline)"
          else
            DIFF=$(python -c "
          a = float('${TOTAL}')
          b = float('${MAIN_TOTAL}')
          diff = a - b
          sign = '+' if diff >= 0 else ''
          print(f'{sign}{diff:.1f}%')
          ")
            COVERAGE_DIFF="${DIFF} vs main (${MAIN_TOTAL}%)"
          fi

          BODY="## CI Results

          $STATUS

          | | |
          |---|---|
          | Tests | $PASSED${FAILED:+ · $FAILED} |
          | Coverage | ${TOTAL}% · ${COVERAGE_DIFF} |

          <details>
          <summary>Coverage detail</summary>

          \`\`\`
          $(grep -A 9999 'Name' test-output.txt | grep -v '^$' | head -40)
          \`\`\`

          </details>"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY" \
            --edit-last 2>/dev/null || \
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY"
